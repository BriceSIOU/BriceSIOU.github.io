<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode | default .Site.Language.Lang }}" dir="ltr" class="no-js">
<head>
  {{/* Runs before paint so a stored light theme never flashes dark. */}}
  <script>(function(){var d=document.documentElement;d.classList.remove('no-js');try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark'){d.setAttribute('data-theme',t);}}catch(e){}})();</script>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ end }}">
  <a class="skip-link" href="#main">{{ i18n "skip_to_content" }}</a>
  {{ if .Site.Params.grain }}<canvas id="grain" aria-hidden="true"></canvas>{{ end }}
  {{ partial "nav.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/main.js" | relURL }}" defer></script>
  {{ if .Site.Params.grain }}<script src="{{ "js/grain.js" | relURL }}" defer></script>{{ end }}
</body>
</html>
