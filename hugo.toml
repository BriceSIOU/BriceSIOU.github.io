baseURL = 'https://bricesiou.github.io/'
defaultContentLanguage = 'fr'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = false
timeZone = 'Africa/Casablanca'
summaryLength = 30

[pagination]
  pagerSize = 8

[taxonomies]
  tag = 'tags'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'dracula'
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

[params]
  name = 'Eninam Brice SIOU'
  email = 'eninambrices@gmail.com'
  phone = '+212 625627115'
  github = 'https://github.com/BriceSIOU'
  githubUser = 'BriceSIOU'
  linkedin = 'https://www.linkedin.com/in/brice-siou/'
  linkedinUser = 'brice-siou'
  themeColor = '#39ff14'
  # Set to false to disable the animated film-grain overlay site-wide
  grain = true

# ─────────────────────────── FRANÇAIS ───────────────────────────
[languages]
  [languages.fr]
    languageName = 'Français'
    languageCode = 'fr-FR'
    contentDir = 'content/fr'
    title = 'Eninam Brice SIOU'
    weight = 1

    [languages.fr.params]
      locale = 'fr_FR'
      subtitle = "Étudiant ingénieur en cybersécurité & cyberintelligence"
      description = "Portfolio d'Eninam Brice SIOU — étudiant ingénieur en cybersécurité et cyberintelligence à l'ENSA Tanger. Cryptographie légère, DevSecOps, sécurité IoT."
      location = 'Tanger, Maroc'
      cv = '/cv/CV_SIOU_ENINAM_BRICE.pdf'

    [[languages.fr.menu.main]]
      name = '~/about'
      pageRef = '/about'
      weight = 1
    [[languages.fr.menu.main]]
      name = '~/projets'
      pageRef = '/projets'
      weight = 2
    [[languages.fr.menu.main]]
      name = '~/articles'
      pageRef = '/articles'
      weight = 3
    [[languages.fr.menu.main]]
      name = '~/lectures'
      pageRef = '/lectures'
      weight = 4
    [[languages.fr.menu.main]]
      name = '~/cv'
      pageRef = '/cv'
      weight = 5
    [[languages.fr.menu.main]]
      name = '~/contact'
      pageRef = '/contact'
      weight = 6

# ─────────────────────────── ENGLISH ────────────────────────────
  [languages.en]
    languageName = 'English'
    languageCode = 'en-US'
    contentDir = 'content/en'
    title = 'Eninam Brice SIOU'
    weight = 2

    [languages.en.params]
      locale = 'en_US'
      subtitle = 'Cybersecurity & cyberintelligence engineering student'
      description = 'Portfolio of Eninam Brice SIOU — cybersecurity and cyberintelligence engineering student at ENSA Tangier. Lightweight cryptography, DevSecOps, IoT security.'
      location = 'Tangier, Morocco'
      cv = '/cv/CV_SIOU_ENINAM_BRICE.pdf'

    [[languages.en.menu.main]]
      name = '~/about'
      pageRef = '/about'
      weight = 1
    [[languages.en.menu.main]]
      name = '~/projects'
      pageRef = '/projets'
      weight = 2
    [[languages.en.menu.main]]
      name = '~/writing'
      pageRef = '/articles'
      weight = 3
    [[languages.en.menu.main]]
      name = '~/reading'
      pageRef = '/lectures'
      weight = 4
    [[languages.en.menu.main]]
      name = '~/cv'
      pageRef = '/cv'
      weight = 5
    [[languages.en.menu.main]]
      name = '~/contact'
      pageRef = '/contact'
      weight = 6

# ──────────────── URLs traduites / translated URLs ────────────────
# Les dossiers de contenu portent des noms français ; ces règles
# donnent à chaque langue des URLs naturelles.
[languages.fr.permalinks.section]
  about = '/a-propos/'
[languages.fr.permalinks.page]
  about = '/a-propos/:slug/'

[languages.en.permalinks.section]
  projets  = '/projects/'
  articles = '/writing/'
  lectures = '/reading/'
[languages.en.permalinks.page]
  projets  = '/projects/:slug/'
  articles = '/writing/:slug/'
  lectures = '/reading/:slug/'
