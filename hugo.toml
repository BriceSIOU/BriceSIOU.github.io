baseURL = 'https://bricesiou.github.io/'
theme = 'terminal'
defaultContentLanguage = 'fr'

[params]
  themeColor = 'green'
  fullWidthTheme = false
  centerTheme = true
  showLanguageSelector = true

[[params.social]]
  name = "github"
  url = "https://github.com/BriceSIOU"

[[params.social]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/brice-siou/"

# --- FRANÇAIS ---
